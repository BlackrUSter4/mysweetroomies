  is the replay list. Character art isn't shipped, so heroines are drawn as
  coloured placeholders.

  On a device, /native/<method>?a=..&b=.. is intercepted by JsViewClient and

  // ---- plumbing -----------------------------------------------------------
  function qs(pairs) {
    var out = [];
    for (var i = 0; i < (pairs || []).length; i++) out.push(encodeURIComponent(pairs[i][0]) + "=" + encodeURIComponent(pairs[i][1]));
    return out.length ? "?" + out.join("&") : "";
  }
  function http(method, url, body, cb) {
    var xhr = new XMLHttpRequest();
    xhr.open(method, url, true);

  }

  function el(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function toast(msg) { var t = el("toast"); t.textContent = msg; t.style.display = "block"; setTimeout(function () { t.style.display = "none"; }, 2200); }
  function heroine(id) { for (var i = 0; i < S.heroines.length; i++) if (S.heroines[i].id === (id || S.heroine_id)) return S.heroines[i]; }
  function visible() { var o = []; for (var i = 0; i < S.heroines.length; i++) if (!S.heroines[i].hidden) o.push(S.heroines[i]); return o; }
  function clock(sec) { function p(n) { return (n < 10 ? "0" : "") + n; } return p(Math.floor(sec / 3600)) + ":" + p(Math.floor(sec % 3600 / 60)) + ":" + p(sec % 60); }
  function face(h) { return '<span class="face" style="background:' + h.color + '">' + esc(h.short.charAt(0)) + "</span>"; }
  function figure(h) {
    if (h.stand_url) return '<div class="pic" style="background-image:url(' + h.stand_url + ')"></div>';
    return '<div class="head" style="background:' + h.color + '"></div><div class="body" style="background:' + h.color + '"></div>';
  }
  // System sounds from the APK / Mega Assets pack (sound effects/se-system-*.ogg).

  function playSound(url) { try { var p = new Audio(url).play(); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
  function se(name) { playSound("/static/1/sound/se/se-system-" + name + ".ogg"); }
  function store(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); } catch (e) {} }
  // Music: the APK's splash BGM, the only music that survived (the home and story tracks were downloads from
  // the live server). It starts on the title, keeps looping on home and fades out when a story starts.
  // Browsers block sound before a touch, so any touch starts it if nothing could (the 4.03 s title callback,
  // or home after returning from a story). Option turns it off (remembered per browser).
  var bgm = null;
  document.addEventListener("click", function () {
    if ((!bgm || bgm.paused) && el("opening").style.display !== "block") playBgm();
  }, true);
  function bgmOff() { try { return localStorage.getItem("bgm_off") === "1"; } catch (e) { return false; } }
  function playBgm() {
    if (bgmOff()) return;
    if (!bgm) { bgm = new Audio("/static/1/sound/bgm/13_01.ogg"); bgm.loop = true; bgm.volume = .6; }
    try { var pr = bgm.play(); if (pr && pr.catch) pr.catch(function () {}); } catch (e) {}
  }
  function fadeBgm() {
    if (!bgm) return;
    var b = bgm, t = setInterval(function () { b.volume = Math.max(0, b.volume - .05); if (!b.volume) { b.pause(); clearInterval(t); } }, 60);

  function toggleBgm() {
    var off = !bgmOff();
    try { localStorage.setItem("bgm_off", off ? "1" : "0"); } catch (e) {}
    el("t-option").className = off ? "off" : "";
    if (off && bgm) { bgm.pause(); } else playBgm();
    toast(off ? "BGM off" : "BGM on");
  }
  function showTitle() {
    el("title").style.display = "block";

  }
  function titleTouch() { if (!bgm || bgm.paused) playBgm(); }
  // A fresh start (a new browser session, like relaunching the app) picks at random: the opening movie

  // (StartGameSceneLayer) or another edition's: Love Rock x うちカノ, Honey I'm Home! (the predecessor's
  // English edition), Full House (Vietnamese), 女子宿舍禁愛令 (Traditional Chinese). Those four are

  var ALT_TITLES = ["alt_loverock.jpg", "alt_honey.jpg", "alt_fullhouse.jpg", "alt_tw.jpg"], afterOpening = null;
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function bootIntro() {
    // ?intro=en|ja (that opening, then a random title), title, alt1..alt4: force one, for testing
    var q = /[?&]intro=(\w+)/.exec(location.search);
    if (q && (q[1] === "en" || q[1] === "ja")) return playOpening(q[1], showRandomTitle);
    if (q && q[1] === "title") return showTitle();
    if (q && /^alt[1-4]$/.test(q[1])) return showRandomTitle(+q[1].charAt(3));
    if (Math.random() < .5) playOpening(pick(["en", "ja"]), showRandomTitle); else showRandomTitle();
  }
  function showRandomTitle(force) {
    var k = typeof force === "number" ? force : Math.floor(Math.random() * (ALT_TITLES.length + 1));
    if (!k) return showTitle();
    var src = "/static/1/img/title/" + ALT_TITLES[k - 1];
    el("alt-img").src = src; el("alt-blur").src = src;
    el("alttitle").style.display = "block";
    setTimeout(function () { if (el("alttitle").style.display === "block") playBgm(); }, 1000);
  }
  function playOpening(lang, then) {
    var v = el("op-video"); afterOpening = then;
    v.src = "/static/1/video/opening_" + lang + ".mp4"; v.muted = false;

        (afterId ? "" : '<div style="text-align:center;font-size:12px">[Energy recovers in: <b id="cd">' + clock(S.tickets.next_in) + "</b>]</div>") +

  // ---- Soundtrack (music room) ----------------------------------------------
  // The official soundtrack (/api/soundtrack), grouped main / character themes / mood. Tapping a track plays it on
  // a loop with its own <audio>; the title BGM is paused so they don't overlap, and playback stops on close.
  function render_ost() {
    if (!ostCache) { el("ost-body").innerHTML = '<p style="text-align:center;color:#8a6a4a">Loading...</p>';
      http("GET", "/api/soundtrack", null, function (s, d) { ostCache = (d && d.tracks) || []; render_ost(); }); return; }
    var secName = {main: "Main Theme", character: "Character Themes", mood: "Mood"}, html = "", lastCat = null;
    for (var i = 0; i < ostCache.length; i++) {
      var t = ostCache[i], on = ostPlaying === t.slug;
      if (t.category !== lastCat) { lastCat = t.category; html += '<div class="sec">' + (secName[t.category] || "") + "</div>"; }
      var icon = on ? '<rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/>' : '<path d="M8 5v14l11-7z"/>';
      html += '<a class="row trk' + (on ? " on" : "") + '" href="javascript:ostPlay(\'' + t.slug + '\')"><span>' + esc(t.title) +
        '</span><span class="ic">' + svg(icon, 15, true) + "</span></a>";
    }
    el("ost-body").innerHTML = html;
  }
  function ostPlay(slug) {
    var t = null;
    for (var i = 0; i < ostCache.length; i++) if (ostCache[i].slug === slug) t = ostCache[i];
    if (!t) return;
    if (ostPlaying === slug) { if (ostAudio) ostAudio.pause(); ostPlaying = null; render_ost(); return; }
    if (bgm) bgm.pause();   // don't play over the title theme
    if (!ostAudio) { ostAudio = new Audio(); ostAudio.loop = true; ostAudio.volume = .7; }
    ostAudio.src = t.url;
    try { var p = ostAudio.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
    ostPlaying = slug; render_ost();
  }
  function ostStop() { if (ostAudio) ostAudio.pause(); ostPlaying = null; }

  // ---- Memory (Main Story / Secret Story / Epilogue / Event Story) ---------
  function openMemory(hid) { memHeroine = heroine(hid).hidden ? visible()[0].id : hid; memTab = "main"; memOpenHead = null; openWin("memory"); }
  function render_memory() {
    var b = el("memory-body"), v = visible(), idx = 0, n = v.length;
    for (var i = 0; i < n; i++) if (v[i].id === memHeroine) idx = i;
    var h = v[idx], pv = v[(idx + n - 1) % n], nx = v[(idx + 1) % n];
    http("GET", "/api/stories/" + h.id, null, function (s, d) {
      var tabs = [["main", "Main<br>Story"], ["secret", "Secret<br>Story"], ["epilogue", "Epilogue<br>&nbsp;"], ["event", "Event<br>Story"]];
      var html = '<div class="ribbon"><span class="side" style="background:' + pv.color + '">' + esc(pv.short) + '</span><a class="arw" href="javascript:memCycle(-1)">&lsaquo;</a>' +
        '<span class="mid' + (h.stand_url ? ' art' : '') + '" style="background:' + h.color + (h.stand_url ? ' url(' + h.stand_url + ') 6% 9% / 62% auto no-repeat' : '') + '">' + (h.stand_url ? '' : face(h)) + esc(h.name) + '<i>&#10084;</i></span><a class="arw" href="javascript:memCycle(1)">&rsaquo;</a>' +
        '<span class="side" style="background:' + nx.color + '">' + esc(nx.short) + "</span></div><div class=\"tabs\">";
      for (var t = 0; t < tabs.length; t++) html += '<a class="' + (memTab === tabs[t][0] ? "on" : "") + '" href="javascript:memTabTo(\'' + tabs[t][0] + "')\">" + tabs[t][1] + "</a>";
      html += "</div>";
      if (memTab === "event") return renderEvents(b, html);
      var rows = [];
      for (var j = 0; j < d.stories.length; j++) {
        var st = d.stories[j], kind = st.kind === "prologue" ? "main" : st.kind;
        // Secret stories are listed once unlocked (their chapter read), read or not.
        if (kind === memTab && (st.read || (kind === "secret" && !st.locked))) rows.push(st);
      }
      var pass = S.memory_pass;
      // Rows are grouped under expandable chapter headings, as in the recordings
      // (Memory > Main Story: "Chapter 4 - Wall of Obstinacy" with a chevron; p99LNijyFWc 19:20).
      var lastHead = null, latest = rows.length ? headOf(rows[rows.length - 1]) : null;
      memHeads = [];
      for (var k = 0; k < rows.length; k++) {
        var hd = headOf(rows[k]);
        if (hd && hd !== lastHead) {
          lastHead = hd;
          var on = memOpenHead === hd || (memOpenHead === null && hd === latest);
          memHeads.push(hd);
          html += '<a class="row head' + (on ? " open" : "") + '" href="javascript:memToggle(' + (memHeads.length - 1) + ')"><span>' + esc(hd) + "</span></a>";
        }
        if (hd && !(memOpenHead === hd || (memOpenHead === null && hd === latest))) continue;
        var open = pass || k >= rows.length - FREE_REPLAYS || (rows[k].kind === "secret" && !rows[k].read);
        html += '<a class="row' + (open ? " go" : "") + '" href="javascript:' + (open ? "playStory('" + rows[k].scenario_id + "')" : "memoryPass()") + '"><span>' + esc(partLabel(rows[k])) + "</span></a>";
      }
      b.innerHTML = html + (rows.length ? "" : '<p style="text-align:center;color:#8a6a4a">No memories yet.</p>');
      b.scrollTop = b.scrollHeight;
    });
  }
  // Event Story: no event text survives, so the known events are listed (with a banner where one
  // survives) and tapping one just says so. famille = 『ファミーユ』 events, uchikano = the predecessor's.
  function renderEvents(b, html) {
    http("GET", "/api/events", null, function (s, d) {
      var ev = (d && d.events) || [];
      for (var i = 0; i < ev.length; i++) {

        var parts = e.parts || (e.scenario_id ? [{scenario_id: e.scenario_id, title: "Preview"}] : []);
        var play = function (sid) { return "javascript:closeWin();native('start_story',[['story_id','" + sid + "'],['callbackurl','/my/']])"; };
        var go = parts.length === 1 ? play(parts[0].scenario_id) : parts.length ? "javascript:void(0)"
                                    : "javascript:toast('This event\\'s story was never recovered.')";
        html += '<a class="row item" href="' + go + '">' +
          (e.banner_url ? '<img src="' + e.banner_url + '" alt="" style="height:56px;border-radius:3px">' : "") +
          "<span>" + esc(e.title) + "<small>" + esc(e.title_jp) + " &middot; " +
          (e.game === "famille" ? "Famille (JP)" : "Uchi-Kano (predecessor)") + (e.date ? " &middot; " + esc(e.date) : "") +

  // Real prices from the 2019 "Night of In App Purchase Shut Down" recording.
  var PACKS = [[1, 0, "0.99"], [5, 1, "4.21"], [12, 3, "10.10"], [20, 6, "16.87"], [28, 12, "23.56"], [42, 26, "35.29"], [78, 57, "65.64"]];
  function openShop(page) { openWin("shop"); if (page) shopPage(page); }
  function render_shop() { shopPage("top"); }
  function shopPage(page) {
    var b = el("shop-body"), html = "", t = {top: "Shop", crystals: "Crystal Shop", items: "Item Shop", energy: "Recover Energy", course: "Monthly Course Shop"}[page];
    el("shop-title").textContent = t;
    if (page === "top") {
      html = '<a class="red" href="javascript:shopPage(\'crystals\')">Buy Crystals</a><a class="red" href="javascript:shopPage(\'items\')">Exchange items</a>' +
        '<a class="red" href="javascript:shopPage(\'energy\')">Recover Energy</a><a class="green" href="javascript:shopPage(\'course\')">Change Monthly Course</a>';
    } else if (page === "crystals") {
      for (var i = 0; i < PACKS.length; i++) {
        var p = PACKS[i], total = p[0] + p[1];
        html += '<div class="row" style="color:#e2457a"><span><span class="hex" style="display:inline-block;width:26px;height:24px;vertical-align:middle;background:linear-gradient(#ffb0c8,#e0457a)"></span> ' +
          p[0] + " crystal" + (p[1] ? " +" + p[1] + " free" : "") + "<small>Price: $" + p[2] + '</small></span><button class="btn" onclick="buy(' + total + ')">Buy</button></div>';
      }
      html += '<a class="blue" href="javascript:shopPage(\'top\')">Back to Shop</a>';
    } else if (page === "items") {
      var items = [["gold_ticket", "Gold Ticket", 5, '<i class="tkt gold">GOLD<br>TICKET</i>'],
                   ["panel_ticket_dx", "Panel Ticket DX", 3, '<i class="tkt panel">PANEL<br>TICKET</i>'],
                   ["memory_pass_30", "Memory Pass 30", 9, '<i class="tkt pass">ALBUM<br>PASS.</i>'],
                   ["memory_pass_90", "Memory Pass 90", 23, '<i class="tkt pass">ALBUM<br>PASS.</i>'],
                   ["memory_pass_180", "Memory Pass 180", 40, '<i class="tkt pass">ALBUM<br>PASS.</i>']];
      for (var q = 0; q < items.length; q++)
        html += '<div class="row item">' + items[q][3] + "<span>" + items[q][1] + "<small>" + items[q][2] + ' crystals</small></span><button class="btn" onclick="exchange(\'' + items[q][0] + '\')">check</button></div>';
      if (S.pass_until && S.pass_until * 1000 > Date.now()) html += '<p style="text-align:center;color:#2b8fd8">Memory Pass valid until ' + new Date(S.pass_until * 1000).toLocaleDateString() + "</p>";
      html += '<a class="blue" href="javascript:shopPage(\'top\')">Back to Shop</a>';
    } else if (page === "energy") {
      html = '<p style="color:#e2457a;text-align:center">Restore one energy bar with 1 crystal.<br><br>The total amount of Crystal: ' + S.crystals + " -> " + Math.max(0, S.crystals - 1) +
        '</p><a class="red" href="javascript:recover(\'crystal\')">Recover Energy</a><a class="blue" href="javascript:shopPage(\'top\')">Back to Shop</a>';
    } else if (page === "course") {
      http("GET", "/api/courses", null, function (s, d) {
        var c = d.courses, h = "";
        for (var k in c) h += '<div class="row" style="display:block"><b>' + k.charAt(0).toUpperCase() + k.slice(1) + " Course" + (c[k].price ? " (Monthly " + c[k].price + ")" : "") +
          "</b><small>" + esc(c[k].text) + "</small></div>";
        b.innerHTML = h + '<p><small>*Each Monthly Course will be charged. (Subscriptions need Google Play; not available in the mock.)</small></p><a class="blue" href="javascript:shopPage(\'top\')">Back to Shop</a>';
      });
      return;
    }
    b.innerHTML = html;
  }
  function buy(total) {
    // purchase_dummy: the app GETs /native/purchase on this server instead of Google Play.
    native("purchase_dummy", [["product_id", "jp.mfapps.novel.roomies.item.credit." + total], ["callback_url", "/my/"]],
      function () { setTimeout(function () { http("GET", "/api/me", null, function (s, d) { if (d) { S = d; renderHome(); } }); }, 800); });
  }
  function exchange(item) { http("POST", "/api/shop/exchange/" + item, {}, function (s, d) { if (s === 200 && d.state) { S = d.state; renderHome(); } toast(s === 200 ? "Exchanged!" : d.error); }); }
  function recover(method) {
    http("POST", "/api/energy/recover", {method: method}, function (s, d) {
      toast(s === 200 ? "Energy recovered!" : d.error);
      if (s === 200) closeWin();
    });
  }

  // ---- Item ---------------------------------------------------------------
  function render_item() {
    var it = S.items, rows = [
      ["Gold Ticket", it.gold_ticket, "Restore all energy", "gold_ticket"],
      ["Silver Ticket", it.silver_ticket, "Restore one energy bar", "silver_ticket"],
      ["Bronze Ticket", it.bronze_ticket, "Restore one energy bar with 4 Bronze Tickets", "bronze_ticket"],
      ["Panel Ticket DX", it.panel_ticket_dx, "Remove one photo panel", "panel"]], html = "";
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      html += '<div class="row"><span>' + r[0] + "<small>You have: " + r[1] + " · " + r[2] + '</small></span><button class="btn" onclick="useItem(\'' + r[3] + "')\">Use</button></div>";
    }
    el("item-body").innerHTML = html;
  }
  function useItem(kind) {
    if (kind === "panel") { http("POST", "/api/panels/use_ticket", {}, function (s, d) { toast(s === 200 ? "A panel was removed!" : d.error); render_item(); }); return; }
    http("POST", "/api/energy/recover", {method: kind}, function (s, d) { toast(s === 200 ? "Energy recovered!" : d.error); render_item(); });
  }

  // ---- Dress Up / Gacha -----------------------------------------------------
  // English names (Chicoine Dgd2gg2wIa0 12:06-13:36): the window is "Machine", banner "Spin with Crystal! Get Her
  // Premium Outfits!! 5 Crystals", "Machine point(s)"; duplicates give Machine Points, 10 points = 1 free spin;
  // Dress Up tabs Face / Clothes / Background.
  // Dress Up (「着せ替えアイテム一覧」, 神崎LEN L59 53:26): tabs Expression / Outfit / Background, a grid
  // of items with locked ones as "?" and a check on the one worn. Outfits come from the gacha; backgrounds and
  // faces (recovered art, research/dress_backgrounds.py, face_items.py) are all available, "?" where art is missing.
  var dressTab = "outfit";
  function setDressTab(t) { dressTab = t; render_dress(); }
  function render_dress() {
    var h = heroine(), tabs = [["face", "Face"], ["outfit", "Clothes"], ["bg", "Background"]];
    var html = '<div class="ptabs">';
    for (var t = 0; t < tabs.length; t++)
      html += '<a class="' + (dressTab === tabs[t][0] ? "on" : "") + '" href="javascript:setDressTab(\'' + tabs[t][0] + '\')">' + tabs[t][1] + "</a>";
    html += '</div><div class="dgrid">';
    var cells = [];
    if (dressTab === "outfit") {
      for (var i = 0; i < h.costume_pool.length; i++) {
        var c = h.costume_pool[i], owned = h.costumes.indexOf(c) >= 0, on = c === (h.costume || "Casual");
        cells.push(owned ? '<a class="' + (on ? "on" : "") + '" href="javascript:equip(\'' + esc(c) + '\')">' + esc(c) + "</a>" : "<i>?</i>");
      }
    } else if (dressTab === "bg") {
      // Background items from the Chinese store ad of this screen; "?" = seen there but the art wasn't recovered
      for (var k = 0; k < S.backgrounds.length; k++) {
        var bgi = S.backgrounds[k];
        cells.push(bgi.url ? '<a class="' + (bgi.name === h.bg ? "on" : "") + '" style="background:url(' + bgi.url +
          ') center / cover;color:#fff;text-shadow:0 0 3px #000" href="javascript:setBg(\'' + esc(bgi.name) + '\')">' + esc(bgi.name) + "</a>" : "<i>?</i>");
      }
    } else {
      // Face: the 9 expressions named on the Taiwan board, each lifted from a story picture (research/face_items.py).
      // They fit only outfits drawn with the frontal head (the Taiwan wardrobe ones); "Default" is the outfit's own face.
      cells.push('<a class="' + (h.face === "Default" ? "on" : "") + '" href="javascript:setFace(\'Default\')">Default</a>');
      for (var j = 0; j < (h.face_pool || []).length; j++) {
        var fc = h.face_pool[j];
        cells.push(fc.url ? '<a class="' + (fc.name === h.face ? "on" : "") + '" style="background:#fff url(' + fc.url +
          ') center 30% / 120% auto no-repeat;color:#fff;text-shadow:0 0 3px #000" href="javascript:setFace(\'' + esc(fc.name) + '\')">' +
          esc(fc.name) + "</a>" : "<i>?</i>");
      }
      if (h.face !== "Default" && !h.face_overlay) html = html.replace('<div class="dgrid">', '<p style="margin:4px 0;font-size:12px;color:#8a6a4a">' +
        "This outfit has no face layer, so the face shows with the Taiwan-edition outfits.</p>" + '<div class="dgrid">');
    }
    while (cells.length < 12) cells.push("<i>?</i>");
    html += cells.join("") + "</div>";
    el("dress-body").innerHTML = html;
  }
  // Gacha (「ガチャ」, L59 53:37): the 「恋結晶でガチャ 着せ替えアイテムGet!!」 banner, the gacha points owned,
  // and one pull for 5 crystals (「恋結晶が1個足りません…」 with 4 owned; banner: 「恋結晶5個」).
  // Gacha flow, as recorded on the same engine (恋Q部, ハルク EygEZekAZhU 1:58-2:17; Famille's own
  // banner and price from 神崎LEN L59 53:37):
  //   1. window: banner, gacha points, 「恋結晶5個でガチャを引く」
  //   2. confirm 「恋結晶5個を使ってガチャを引きますか？ [ガチャる!] [今は辞める!]」
  //   3. capsule machine: handle turns, a capsule drops, rolls, glows, white flash (Skip button)
  //   4. result card 「[服装] … をGET!!」 + gacha-get jingle, then Shop / Dress Up buttons
  var GACHA_COST = 5;   // app.py GACHA_COST
  var gachaResult = null;
  function render_gacha() {
    var h = heroine(), short = GACHA_COST - S.crystals, html = '<img class="gbanner" src="/static/1/img/ui/gacha_banner.png" alt="">';
    if (gachaResult) {
      var r = gachaResult;
      html += '<div class="gres">' + (r.url ? '<img src="' + r.url + '">' : "<i></i>") +
        "<div><span>[Outfit] " + esc(h.short) + "'s " + esc(r.costume) + "</span><br>GET!!" +
        (r.duplicate ? "<small>Already owned &mdash; you got a Gold Ticket instead.</small>" : "") + "</div></div>";
    } else {
      html += '<div class="gpts">Machine point(s): <b>0</b></div>';
    }
    if (h.costume_pool.length <= 1) {
      html += '<div class="gshort">No outfits for ' + esc(h.short) + " have been recovered yet.</div>";
    } else if (short > 0) {
      html += '<div class="gshort">You need ' + short + " more crystal" + (short === 1 ? "" : "s") + '&hellip;</div><a class="blue" href="javascript:openShop()">Go to the Shop!</a>';
    } else {
      html += '<a class="red" href="javascript:gachaConfirm()">Spin with ' + GACHA_COST + " Crystals</a>";
    }
    if (gachaResult) html += '<a class="blue" href="javascript:openWin(\'dress\')">Dress Up</a>';
    el("gacha-body").innerHTML = html;
  }
  function gachaConfirm() {
    var g = el("gacha-anim");
    g.innerHTML = '<div class="gconf"><p>Use ' + GACHA_COST + ' Crystals to spin the Machine?</p>' +
      '<a class="red" href="javascript:gacha()">Spin!</a><a class="blue" href="javascript:gachaClose()">Not now!</a></div>';
    g.style.display = "block";
  }
  function gachaClose() { var g = el("gacha-anim"); g.style.display = "none"; g.innerHTML = ""; render_gacha(); }
  function gacha() {
    http("POST", "/api/gacha/" + S.heroine_id, {}, function (s, d) {
      if (s !== 200) { gachaClose(); toast((d && d.error) || "Error " + s); return; }
      S = d.state;
      gachaResult = d;
      var g = el("gacha-anim");
      g.innerHTML = '<video id="gvid" src="/static/1/img/ui/gacha_spin.mp4" playsinline muted autoplay></video>' +
        '<a class="gskip" href="javascript:gachaDone()">Skip</a>';
      var v = el("gvid");
      v.onended = gachaDone;
      v.onerror = gachaDone;
      var p = v.play && v.play(); if (p && p.catch) p.catch(gachaDone);
    });
  }
  function gachaDone() {
    var g = el("gacha-anim");
    if (g.style.display === "none") return;
    playSound("/static/1/img/ui/gachaget.ogg");
    gachaClose();
    renderHome();
  }
  function setFace(f) { http("POST", "/api/dress_face/" + S.heroine_id, {face: f}, function (s, d) { if (d) { S = d; renderHome(); render_dress(); } }); }
  // Dress Up > Face: the chosen face drawn over her outfit, scaled like the stand (centre top, full height of #heroine).
  function placeFace() {
    var h = heroine(), box = el("heroine"), o = h && h.face_overlay, im = el("faceov");
    if (!o || !h.stand_url) { if (im) im.style.display = "none"; return; }
    if (!im) { im = document.createElement("img"); im.id = "faceov"; im.alt = ""; im.style.position = "absolute"; im.style.pointerEvents = "none"; }
    if (im.parentNode !== box) box.appendChild(im);
    var k = box.offsetHeight / o.ih, left = (box.offsetWidth - o.iw * k) / 2;
    im.src = o.url; im.style.display = "block";
    im.style.left = (left + o.x * k) + "px"; im.style.top = (o.y * k) + "px";
    im.style.width = (o.w * k) + "px"; im.style.height = (o.h * k) + "px";
  }
  window.addEventListener("resize", function () { if (S) placeFace(); });
  function setBg(b) { http("POST", "/api/dress_bg/" + S.heroine_id, {bg: b}, function (s, d) { if (d) { S = d; renderHome(); render_dress(); } }); }
  function equip(c) { http("POST", "/api/costume/" + S.heroine_id, {costume: c}, function (s, d) { if (d) { S = d; renderHome(); render_dress(); } }); }

  // ---- Photo / More --------------------------------------------------------
  // Photo window (DBzQdN-tyn4 3:57:20): tabs Photo Panel / Event / Epilogue; the current panel
  // picture shows through the panels already removed (4x4); a viewed picture has its caption.
  var photoTab = "panel";
  function render_photo() {
    var P = S.panels, cur = P.current, html = "", tabs = [["panel", "Photo Panel"], ["event", "Event"], ["epilogue", "Epilogue"]];
    html += '<div class="ptabs">';
    for (var t = 0; t < tabs.length; t++) html += '<a class="' + (photoTab === tabs[t][0] ? "on" : "") + '" href="javascript:setPhotoTab(\'' + tabs[t][0] + '\')">' + tabs[t][1] + "</a>";
    html += "</div>";
    if (photoTab === "panel") {
      var g = "";
      for (var i = 0; i < P.total; i++) g += i < P.revealed ? "<i class=\"open\"></i>" : "<i></i>";
      html += '<div id="panels"' + (cur ? ' style="background-image:url(' + cur.url + ')"' : "") + ">" + g + "</div>" +
        '<p class="pcap">' + (cur ? esc(cur.caption) + "<br>" : "") + "<small>Log in daily to remove a panel · " + P.revealed + "/" + P.total + "</small></p>";
    }
    var list = S.photos.filter(function (p) { return p.kind === photoTab; });
    for (var j = 0; j < list.length; j++)
      html += '<a class="row" href="javascript:viewPhoto(' + S.photos.indexOf(list[j]) + ')"><span>' + esc(list[j].caption) + "<small>" + esc(list[j].sub) + "</small></span></a>";
    if (!list.length && photoTab !== "panel") html += "<p><small>" + (photoTab === "event" ? "No event pictures have been recovered." : "Read an epilogue to keep its picture here.") + "</small></p>";
    el("photo-body").innerHTML = html;
  }
  function setPhotoTab(t) { photoTab = t; render_photo(); }
  function closePhoto() { el("photoview").style.display = "none"; }
  function viewPhoto(i) {
    var p = S.photos[i], v = el("photoview");
    v.innerHTML = '<img src="' + p.url + '"><div>' + esc(p.caption) + "<br>" + esc(p.sub) + '<br><a href="javascript:closePhoto()">Close</a></div>';
    v.style.display = "block";
  }
  function render_more() {
    el("more-body").innerHTML =
      '<div class="row"><span>Name<small>Shown in the story</small></span><button class="btn" onclick="rename()">' + esc(S.name) + "</button></div>" +
      '<div class="row"><span>User ID<small>' + esc(S.invite_id) + "</small></span></div>" +
      '<div class="row"><span>Options</span><button class="btn" onclick="native(\'show_option_menu\')">Open</button></div>' +
      '<div class="row"><span>Opening movie</span><button class="btn" onclick="native(\'play_movie\',[[\'scene\',\'opening\'],[\'callback_url\',\'/my/\']])">Play</button></div>' +
      '<div class="row"><span>Back to title</span><button class="btn" onclick="native(\'go_top\')">Go</button></div>';
  }
  // The app's WebView has no prompt() dialog, so the name is typed into the page's own modal box.
  function rename() {
    el("modal-body").innerHTML = "What's your name?<br><small>Up to 12 letters. It replaces William in the stories; change it any time in Menu &gt; More.</small>" +
      '<input id="namein" maxlength="12" style="display:block;width:80%;margin:10px auto;font-size:16px;padding:6px;' +
      'border:1px solid #9cc;border-radius:4px;text-align:center">' +
      '<a class="red" href="javascript:saveName()">OK</a><a class="blue" href="javascript:hideModal()">Cancel</a>';
    el("modal").style.display = "block";
    var i = el("namein"); i.value = S.name || ""; i.focus();
    i.onkeydown = function (e) { if (e.keyCode === 13) saveName(); };
  }
  function saveName() {
    var n = (el("namein").value || "").replace(/^\s+|\s+$/g, "");
    if (!n) { toast("Please enter a name."); return; }
    http("POST", "/api/name", {name: n}, function (s, d) { hideModal(); if (d) { S = d; render_more(); toast("Name changed!"); } });
  }

  // ---- boot ---------------------------------------------------------------
  el("homeicon").innerHTML = svg(ICON.house, 34);
  el("bookicon").innerHTML = '<svg viewBox="0 0 84 66" width="84" height="66"><path d="M42 12C30 4 14 4 4 8v52c10-4 26-4 38 4 12-8 28-8 38-4V8C70 4 54 4 42 12z" fill="#fff" stroke="#f7a6c2" stroke-width="2"/>' +
    '<path d="M42 12v52" stroke="#f7a6c2" stroke-width="2"/><path d="M12 20c8-2 16-2 24 2M12 30c8-2 16-2 24 2M12 40c8-2 16-2 24 2M48 22c8-4 16-4 24-2M48 32c8-4 16-4 24-2M48 42c8-4 16-4 24-2" stroke="#f9c0d4" stroke-width="2" fill="none"/></svg>';
  el("lockicon").innerHTML = '<svg viewBox="0 0 36 32" width="36" height="32"><path d="M18 30C6 21 1 15 1 9a8 8 0 0 1 17-3 8 8 0 0 1 17 3c0 6-5 12-17 21z" fill="#ffc7c0" stroke="#f6be5a" stroke-width="2"/>' +
    '<rect x="12" y="13" width="12" height="10" rx="2" fill="#9a7a4a"/><path d="M14 13v-3a4 4 0 0 1 8 0v3" stroke="#9a7a4a" stroke-width="2" fill="none"/></svg>';
  el("tickertext").textContent = "Welcome to the share-house Famille!";
  http("GET", "/api/news", null, function (st, d) { var n = d && (d.news || d)[0]; if (n && n.title) el("tickertext").textContent = n.title; });
  var his = document.querySelectorAll(".win .t .hi");
  for (var hi = 0; hi < his.length; hi++) his[hi].innerHTML = svg(ICON.house, 22);
  renderHome();
  http("POST", "/api/login_bonus", {}, function (status, data) {
    if (data && data.granted) se("bonus");
    if (data && data.granted) toast(data.item ? "You got a LOGIN BONUS! " + (data.item === "silver_ticket" ? "A Silver Ticket" : "A Panel Ticket DX") + " and a photo panel!"
                                              : "A photo panel was removed! Next LOGIN BONUS: " + data.next_in + " more login.");
  });
  var after = /^#\/my\/after\/(\w+)/.exec(location.hash), touched = /^#\/my\/touched\/(\w+)/.exec(location.hash);
  if (!location.hash && !store("title_seen")) { store("title_seen", "1"); bootIntro(); }
  if (after) showResult(after[1]);
  else if (touched) showTouched();
  else if (!S.prologue_done) storyButton();
  // Ask once for the player's name, after the Prologue (the stories call the player William until then).
  else if (S.prologue_done && S.name === "William") {
    var asked = null; try { asked = localStorage.getItem("name_asked"); localStorage.setItem("name_asked", "1"); } catch (e) {}
    if (!asked) setTimeout(rename, 600);
  }
</script>
</body>
</html>
